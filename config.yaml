# All experiment settings for the study. Every number in the paper is produced from this file.
seed: 42
data:
  files: [data/datatraining.txt, data/datatest.txt, data/datatest2.txt]
  co2_threshold_ppm: 1000        # ICOP-IAQ 2010 ceiling limit (DOSH, 2010); Poor IAQ if CO2 > threshold
  base_features: [Temperature, Humidity, Light]   # CO2 is never used as an input
  delta_window_min: 15           # window for rate-of-change features (ablation only)
  baseline_window: 24h           # baseline-corrected features: value minus its past-24-h minimum (ablation only)
protocols:
  random:        {test_size: 0.30, inner_cv: stratified_kfold, inner_folds: 3}
  leave_one_day_out: {group: calendar_day, inner_cv: group_kfold, inner_folds: 3}
  chronological: {train_end: "2015-02-10 23:59", test_start: "2015-02-11 00:00", inner_cv: group_kfold, inner_folds: 3}
tuning_metric: average_precision   # PR-AUC of the Poor-IAQ class: hyperparameters are chosen without reference to a cut-off
threshold_tuning: true          # decision threshold chosen to maximise F1 on inner out-of-fold scores (training data only), same for every model
svm_max_train: 20000            # kernel SVM fitted on a stratified sample of at most 20,000 training rows (all studies)
bootstrap: {unit: calendar_day, n_resamples: 2000, ci: 0.95}
models:
  LR:   {estimator: LogisticRegression, fixed: {max_iter: 2000}, grid: {C: [0.01, 0.1, 1, 10]}}
  LDA:  {estimator: LinearDiscriminantAnalysis, fixed: {}, grid: {}}
  NB:   {estimator: GaussianNB, fixed: {}, grid: {}}
  KNN:  {estimator: KNeighborsClassifier, fixed: {}, grid: {n_neighbors: [5, 11, 21, 51], weights: [uniform, distance]}}
  DT:   {estimator: DecisionTreeClassifier, fixed: {}, grid: {max_depth: [3, 5, 8, null], min_samples_leaf: [1, 20, 100]}}
  RF:   {estimator: RandomForestClassifier, fixed: {n_estimators: 300, n_jobs: 2}, grid: {max_depth: [5, 10, 20], min_samples_leaf: [5, 20]}}
  ET:   {estimator: ExtraTreesClassifier, fixed: {n_estimators: 300, n_jobs: 2}, grid: {max_depth: [5, 10, 20], min_samples_leaf: [5, 20]}}
  AdaBoost: {estimator: AdaBoostClassifier, fixed: {}, grid: {n_estimators: [50, 200], learning_rate: [0.1, 1.0]}}
  GB:   {estimator: GradientBoostingClassifier, fixed: {n_estimators: 100, learning_rate: 0.1}, grid: {max_depth: [2, 3]}}
  HGB:  {estimator: HistGradientBoostingClassifier, fixed: {max_iter: 200}, grid: {learning_rate: [0.05, 0.1], max_depth: [3, null]}}
  SVM:  {estimator: SVC, fixed: {}, grid: {kernel: [linear, rbf], C: [0.1, 1, 10]}}
  MLP:  {estimator: MLPClassifier, fixed: {max_iter: 1000, early_stopping: true, learning_rate_init: 0.001}, grid: {hidden_layer_sizes: [[10], [20, 10]], alpha: [0.0001, 0.01]}}
ablation:
  models: auto_top3            # three best models by leave-one-day-out F1
  hyperparameters: retuned        # grid search and threshold re-run inside every fold, as in the main experiment
  feature_sets:
    All (T+RH+L): [Temperature, Humidity, Light]
    w/o Temperature: [Humidity, Light]
    w/o Humidity: [Temperature, Light]
    w/o Light: [Temperature, Humidity]
    Temperature only: [Temperature]
    Humidity only: [Humidity]
    Light only: [Light]
    + Humidity ratio: [Temperature, Humidity, Light, HumidityRatio]
    + Rate of change: [Temperature, Humidity, Light, dTemperature, dHumidity, dLight]
    + Time of day: [Temperature, Humidity, Light, hour_sin, hour_cos]
    Baseline-corrected T, RH + L: [bTemperature, bHumidity, Light]
    Baseline-corrected + rate of change: [bTemperature, bHumidity, Light, dTemperature, dHumidity, dLight]
  thresholds_ppm: [800, 1000, 1200]
multisite:                         # multi-pollutant extension: work-from-home offices (Rysanek, 2024; CC BY 4.0)
  file: data/wfh/wfh_long.csv
  inputs: [Temperature, Humidity, SPL]   # low-cost temperature, RH and sound pressure level; CO2, PM2.5 and TVOC are never inputs
  thresholds: {CO2_ppm: 1000, PM25_ugm3: 15, TVOC_ppb: 3000}   # ICOP-IAQ 2010 (CO2, TVOC 3 ppm); WHO 2021 24-h guideline (PM2.5)
  outer_folds: 5                    # leave-sites-out: GroupKFold over 95 sites
  chrono_train_frac: 0.7           # chronological hold-out: first 70% of the monitoring period for training
  ablation:                        # Study 2 ablations: three best leave-sites-out models, re-tuned inside every fold
    feature_sets:
      All (T+RH+SPL): [Temperature, Humidity, SPL]
      w/o Temperature: [Humidity, SPL]
      w/o Humidity: [Temperature, SPL]
      w/o SPL: [Temperature, Humidity]
      Temperature only: [Temperature]
      Humidity only: [Humidity]
      SPL only: [SPL]
      + Rate of change (1 h): [Temperature, Humidity, SPL, dTemperature, dHumidity, dSPL]
      + Time of day: [Temperature, Humidity, SPL, hour_sin, hour_cos]
      + Rate of change + time of day: [Temperature, Humidity, SPL, dTemperature, dHumidity, dSPL, hour_sin, hour_cos]
    pm25_thresholds: [15, 25, 35]  # WHO 2021 guideline, WHO 2021 interim target 4, MAAQS 2020 (24-h values)
sensitivity:                       # high-pollution datasets modelled under Malaysian limits (PM2.5 35, PM10 100 ug/m3; MAAQS 2020)
  dalton_file: data/dalton/dalton_hourly.csv   # DALTON (Karmakar et al., 2024), hourly means of 1-Hz data, 29 sites
  lovric_file: data/lovric/lovric_minute.csv   # Lovric et al. (2025), 1-min reference-grade data, 26 days
  models: [LR, DT, KNN]
